name: Deploy site

# Manual only: the site is deployed on demand, not on every push. Building renders
# the demo video with Remotion (minutes), and rebuilds should be a deliberate act.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Pinned Debian build environment (fonts + Chrome deps). GHA layer cache keeps
      # it out of the critical path unless demo/Dockerfile or its deps change.
      - name: Build the site image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: demo
          file: demo/Dockerfile
          tags: buildcage-site-build:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Renders the video and builds dist/ inside the container so the published
      # output matches a local Docker build byte for byte.
      - name: Build the site in the container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/src:ro \
            -v "$RUNNER_TEMP/out":/out \
            buildcage-site-build
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/out"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/out/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
